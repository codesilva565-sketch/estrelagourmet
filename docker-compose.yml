services:
  estrela-gourmet:
    build:
      context: .
      args:
        # VITE_* sao embutidas no bundle do cliente em tempo de build
        VITE_DEMO_MODE: "false"
        VITE_SUPABASE_URL: "${SUPABASE_URL}"
        VITE_SUPABASE_PUBLISHABLE_KEY: "${SUPABASE_PUBLISHABLE_KEY}"
    image: estrela-gourmet:latest
    container_name: estrela-gourmet
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    # Acesso SOMENTE local: o Nginx (host) faz o proxy do dominio para 127.0.0.1:3001.
    # Nao expor para fora: a porta 3001 nao fica acessivel publicamente.
    ports:
      - "127.0.0.1:3001:3000"
